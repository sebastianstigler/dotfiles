# vim:ft=lua
conky.config = {
--#####################
-- - Conky settings - #
--#####################
	update_interval = 1,
	total_run_times = 0,
	net_avg_samples = 1,
	cpu_avg_samples = 1,
	if_up_strictness = 'link',

	imlib_cache_size = 0,
	double_buffer = true,
	no_buffers = true,

	--xinerama_head = 1,

	format_human_readable = true,

--####################
-- - Text settings - #
--####################
	use_xft = true,
	font = 'Liberation Sans:size=9',
	override_utf8_locale = true,
	text_buffer_size = 2048,

--############################
-- - Window specifications - #
--############################
	own_window_class = 'Conky',
	own_window = true,
	own_window_type = 'desktop',
	--own_window_type = 'normal',
	own_window_transparent = true,
	own_window_argb_visual = true,
	own_window_argb_value = 200,
--	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

	alignment = 'top_right',
	--gap_x = 1050,
	--gap_y = 50,
	minimum_width = 250, minimum_height = 900,
	maximum_width = 300,

	default_bar_width = 60, default_bar_height = 8,

--########################
-- - Graphics settings - #
--########################
	draw_shades = false,

	default_color = '#E2DACB',

	color0 = '#F0EBE2',
--	color1 = '#77216F',
	color1 = '#33cccc',
	color2 = '#E6E6E6',
--	color3 = '#2C001E',
	color3 = '#29a3a3',
	color4 = '#990033',
	color5 = '#009933',

};

conky.text = [[
${font Liberation Sans:style=Bold:size=8}SYSTEM $stippled_hr${font}
##############
# - SYSTEM - #
##############
${color0}${voffset 18}${offset 4}${font ConkyColorsLogos:size=10}u${font}${color}${voffset -0}
${color0}${font ConkyColors:size=16}b${font}${color}
${goto 38}${voffset -49}Kernel: ${alignr}${color2}${kernel}${color}
${goto 38}Uptime: ${alignr}${color2}${uptime}${color}
${goto 38}Loadavg: ${alignr}${color2}${loadavg 1}  ${loadavg 2}  ${loadavg 3}${color}
${alignr}${loadgraph 20,70 196666 29a3a3 -l -t}
# |--CPU
${voffset 15}${color0}${font ConkyColors:size=16}c${font}${offset -25}${voffset 10}${cpubar cpu0 4,17}${color}${voffset -16}\
${goto 38}CPU1: ${font Liberation Sans:style=Bold:size=8}${color1}${cpu cpu1}%${font} ${alignr}${offset 15}${font Liberation Sans:style=Bold:size=8}${color1}${execi 30 sensors | grep 'Core 0' | awk '{print $3}' | sed 's/+//' | sed 's/\.0//'}${color}${font}  ${alignr}${color2}${cpugraph cpu1 10,70 196666 29a3a3}${color}
${goto 38}CPU2: ${font Liberation Sans:style=Bold:size=8}${color1}${cpu cpu2}%${font} ${alignr}${offset 15}${font Liberation Sans:style=Bold:size=8}${color1}${execi 30 sensors | grep 'Core 1' | awk '{print $3}' | sed 's/+//' | sed 's/\.0//'}${color}${font}  ${alignr}${color2}${cpugraph cpu2 10,70 196666 29a3a3}${color}
# ${goto 38}CPU3: ${font Liberation Sans:style=Bold:size=8}${color1}${cpu cpu3}%${font} ${alignr}${offset 15}${font Liberation Sans:style=Bold:size=8}${color1}${execi 30 sensors | grep 'Core 2' | awk '{print $3}' | sed 's/+//' | sed 's/\.0//'}${color}${font}  ${alignr}${color2}${cpugraph cpu3 10,70 196666 29a3a3}${color}
# ${goto 38}CPU4: ${font Liberation Sans:style=Bold:size=8}${color1}${cpu cpu4}%${font} ${alignr}${offset 15}${font Liberation Sans:style=Bold:size=8}${color1}${execi 30 sensors | grep 'Core 3' | awk '{print $3}' | sed 's/+//' | sed 's/\.0//'}${color}${font}  ${alignr}${color2}${cpugraph cpu4 10,70 196666 29a3a3}${color}
# |--MEM
${voffset 2}${color0}${font ConkyColors:size=15}g${font}${color}${goto 38}${voffset -7}RAM: ${font Liberation Sans:style=Bold:size=8}${color1}$memperc%${color}${font}
${offset 1}${color0}${membar 4,17}${color}${goto 38}F: ${font Liberation Sans:style=Bold:size=8}${color2}${memeasyfree}${color}${font} U: ${font Liberation Sans:style=Bold:size=8}${color2}${mem}${color}${font}
# |--SWAP
${voffset 2}${color0}${font ConkyColors:size=15}z${font}${color}${voffset -8}${goto 38}SWAP: ${font Liberation Sans:style=Bold:size=8}${color1}${swapperc}%${color}${font}
${voffset 2}${offset 1}${color0}${swapbar 4,17}${color}${voffset -2}${goto 38}F: ${font Liberation Sans:style=Bold:size=8}${color2}$swapmax${color}${font} U: ${font Liberation Sans:style=Bold:size=8}${color2}$swap${color}${font}
# |--BATTERY
${if_existing /sys/class/power_supply/CMB1}${color0}${font ConkyColors:size=15}6${font}${color}${goto 38}${voffset -6}Batterie: ${font Liberation Sans:style=Bold:size=8}${color1}${battery_percent CMB1}%${color}${font} ${alignr}${color2}${battery_bar CMB1 10,70}${color}${else}${color0}${font ConkyColors:size=15}6${font}${color}${goto 38}${voffset -6}Batterie: ${font Liberation Sans:style=Bold:size=8}${color2}Unbekannter Status${color}${font}${endif}
# |--PROC
${voffset 4}${color0}${font ConkyColors:size=16}C${font}${color}${goto 38}${voffset -10}Prozesse: ${color2}${alignr 13}CPU${alignr}RAM${color}
${voffset -1}${goto 42}${color2}${top name 1}${color}${font Liberation Sans:style=Bold:size=8}${color1} ${goto 190}${top cpu 1}${alignr }${top mem 1}${color}${font}
${voffset -1}${goto 42}${color2}${top name 2}${color}${font Liberation Sans:style=Bold:size=8}${color1} ${goto 190}${top cpu 2}${alignr }${top mem 2}${color}${font}
${voffset -1}${goto 42}${color2}${top name 3}${color}${font Liberation Sans:style=Bold:size=8}${color1} ${goto 190}${top cpu 3}${alignr }${top mem 3}${color}${font}
${voffset -1}${goto 42}${color2}${top name 4}${color}${font Liberation Sans:style=Bold:size=8}${color1} ${goto 190}${top cpu 4}${alignr }${top mem 4}${color}${font}
${voffset -1}${goto 42}${color2}${top name 5}${color}${font Liberation Sans:style=Bold:size=8}${color1} ${goto 190}${top cpu 5}${alignr }${top mem 5}${color}${font}
#############
# - CLOCK - #
#############
${voffset 4}${font Liberation Sans:style=Bold:size=8}DATUM $stippled_hr${font}
${voffset -2}${alignc 38}${color2}${font Liberation Sans:style=Bold:size=30}${time %H:%M}${font}${color}
${alignc}${time %d %B %Y}
##########
# - HD - #
##########
${voffset 4}${font Liberation Sans:style=Bold:size=8}HD $stippled_hr${font}
# |--HDTEMP1
# ${voffset 4}${offset 2}${color0}${font ConkyColors:size=15}8${font}${color}${voffset -3}${goto 38}Temperatur: ${font Liberation Sans:style=Bold:size=8}${color1}${execi 120 hddtemp /dev/sda -n --unit=C}°C${color}${font}${alignr}${color2}/dev/sda${color}
${execpi 30 ~/.config/conky/conkyHD1}
################
# - FIREWALL - #
################
${voffset 0}${font Liberation Sans:style=Bold:size=8}FIREWALL $stippled_hr${font}
${voffset 0}${offset 2}${execpi 30 sudo ~/.config/conky/ufwstatuscolor}${font Webdings:size=15}d${font}${color}${voffset -3}${goto 38}Status: ${font Liberation Sans:style=Bold:size=8}${color1}${execpi 30 sudo ~/.config/conky/ufwstatus}${color}
${voffset 4}
###############
# - NETWORK - #
###############
${voffset -4}${font Liberation Sans:style=Bold:size=8}NETZWERK $stippled_hr${font}
# |--WLAN0
${if_up wlp0s20f3}
${voffset -5}${color0}${font ConkyColors:size=15}s${font}${color}${goto 38}${voffset -12}Up: ${font Liberation Sans:style=Bold:size=8}${color1}${upspeed wlp0s20f3}${color}${font} ${alignr}${color2}${upspeedgraph wlp0s20f3 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totalup wlp0s20f3}${color}${font}
${voffset 2}${color0}${font ConkyColors:size=15}t${font}${color}${goto 38}${voffset -12}Down: ${font Liberation Sans:style=Bold:size=8}${color1}${downspeed wlp0s20f3}${color}${font} ${alignr}${color2}${downspeedgraph wlp0s20f3 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totaldown wlp0s20f3}${color}${font}
${color0}${font ConkyColors:size=15}j${font}${color}${voffset -6}${goto 38}sinal: ${font Liberation Sans:style=Bold:size=8}${color1}${wireless_link_qual_perc wlp0s20f3}%${color}${font} ${alignr}${color2}${wireless_link_bar 8,60 wlp0s20f3}${color}
${voffset 2}${color0}${font ConkyColors:size=15}B${font}${color}${goto 38}${voffset -6}Lokale IP: ${alignr}${color2}${addr wlp0s20f3}${color}
${goto 38}Öffentliche IP: ${alignr}${color2}${execi 10800 ~/.config/conky/conkyIp}${color}
# |--ETH0
${else}${if_up enp0s31f6}
${voffset -5}${color0}${font ConkyColors:size=15}s${font}${color}${goto 38}${voffset -12}Up: ${font Liberation Sans:style=Bold:size=8}${color1}${upspeed enp0s31f6}${color}${font} ${alignr}${color2}${upspeedgraph enp0s31f6 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totalup enp0s31f6}${color}${font}
${voffset 4}${color0}${font ConkyColors:size=15}t${font}${color}${goto 38}${voffset -12}Down: ${font Liberation Sans:style=Bold:size=8}${color1}${downspeed enp0s31f6}${color}${font} ${alignr}${color2}${downspeedgraph enp0s31f6 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totaldown enp0s31f6}${color}${font}
${voffset 2}${color0}${font ConkyColors:size=15}B${font}${color}${goto 38}${voffset -6}Lokale IP: ${alignr}${color2}${addr enp0s31f6}${color}
${goto 38}Öffentliche IP: ${alignr}${color2}${execi 10800 ~/.config/conky/conkyIp}${color}
# |--ENP4S0
${else}${if_up enp4s0}
${voffset -5}${color0}${font ConkyColors:size=15}s${font}${color}${goto 38}${voffset -12}Up: ${font Liberation Sans:style=Bold:size=8}${color1}${upspeed enp4s0}${color}${font} ${alignr}${color2}${upspeedgraph enp4s0 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totalup enp4s0}${color}${font}
${voffset 2}${color0}${font ConkyColors:size=15}t${font}${color}${goto 38}${voffset -12}Down: ${font Liberation Sans:style=Bold:size=8}${color1}${downspeed enp4s0}${color}${font} ${alignr}${color2}${downspeedgraph enp4s0 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totaldown enp4s0}${color}${font}
${voffset 4}${color0}${font ConkyColors:size=15}B${font}${color}${goto 38}${voffset -6}Lokale IP: ${alignr}${color2}${addr enp4s0}${color}
# |--PPP0
${else}${if_up ppp0}
${voffset -5}${color0}${font ConkyColors:size=15}s${font}${color}${goto 38}${voffset -12}Up: ${font Liberation Sans:style=Bold:size=8}${color1}${upspeed ppp0}${color}${font} ${alignr}${color2}${upspeedgraph ppp0 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totalup ppp0}${color}${font}
${voffset 2}${color0}${font ConkyColors:size=15}t${font}${color}${goto 38}${voffset -12}Down: ${font Liberation Sans:style=Bold:size=8}${color1}${downspeed ppp0}${color}${font} ${alignr}${color2}${downspeedgraph ppp0 8,60 196666 29a3a3}${color}
${goto 38}Insgesamt: ${font Liberation Sans:style=Bold:size=8}${color2}${totaldown ppp0}${color}${font}
${voffset 2}${color0}${font ConkyColors:size=15}B${font}${color}${goto 38}${voffset -6}Lokale IP: ${alignr}${color2}${addr ppp0}${color}
${else}${voffset 4}${color0}${font ConkyColors:size=15}q${font}${color}${voffset -6}${goto 38}Netzwerk nicht verfügbar${voffset 14}${endif}${endif}${endif}${endif}
]];
