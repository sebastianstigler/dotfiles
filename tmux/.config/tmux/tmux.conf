# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'sebastianstigler/tmux-catppuccino'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'knakayama/tmux-uptime'
set -g @plugin 'tmux-plugins/tmux-open'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'


set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
#set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag, ,}"

set -g @catppuccin_status_modules_right "application session pane uptime date_time"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

###
set -g @catppuccin_date_time_icon ""
set -g @catppuccin_date_time_text "%d %b %R"

set-option -g status-position top

# zsh is kinda tight
set-option -g default-shell $SHELL

# look good
set -g default-terminal "xterm-256color"

# Workaround for vim
set-window-option -g xterm-keys on

# statusbar 
set -g status-fg white
set -g status-bg black

set -g window-status-style fg=colour245,bg=default,dim
#set -g window-status-bg default
#set -g window-status-attr dim

set -g window-status-current-style fg=white,bg=colour234,bright
# set -g window-status-current-bg colour234
# set -g window-status-current-attr bright

# pane colors
# START:panecolors
#set -g pane-border-fg green
#set -g pane-border-bg black
#set -g pane-active-border-fg white
#set -g pane-active-border-bg yellow
# END:panecolors

# Command / message line
# START:cmdlinecolors
set -g message-style fg=white,bg=black,bright
#set -g message-bg black
#set -g message-attr bright
# END:cmdlinecolors

# Status line left side
# START:statusleft
set -g status-left-length 45 
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
# END:statusleft

# Status line right side
# 15% | 28 Nov 18:15
# START: statusright
set -g status-right "#[fg=colour136]#{uptime}↑ #[fg=cyan]%d %b %R"
# END:statusright

# Update the status bar every sixty seconds
# START:updateinterval
set -g status-interval 60
# END:updateinterval

# Center the window list
# START:centerwindowlist
set -g status-justify centre
# END:centerwindowlist
 
# shortcut for synchronize-panes toggle
# START:sync
bind C-s set-window-option synchronize-panes
# END:sync

### use prefix z to maximize and minimize

# Log output to a text file on demand
# START:pipe-pane
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"
# END:pipe-pane

# act like GNU screen
unbind C-b
set -g prefix C-a

#setting the delay between prefix and command
# START:delay
set -s escape-time 1
# END:delay

# Ensure that we can send Ctrl-A to other apps
# START:bind_prefix
bind C-a send-prefix
# END:bind_prefix

# Set the base index for windows to 1 instead of 0
# START:index
set -g base-index 1
# END:index

# Set the base index for panes to 1 instead of 0
# START:panes_index
setw -g pane-base-index 1
# END:panes_index

# a mouse
set -g mouse on
# Enable our custom option to exit copy mode when scrolling past bottom
set -g @scroll-down-exit-copy-mode "on"

# act like vim
setw -g mode-keys vi
unbind [
bind ` copy-mode
unbind p
bind p paste-buffer
#bind -t vi-copy v begin-selection
#bind -t vi-copy y copy-selection
# Kill Server 
bind X confirm-before -p "kill-server #W? (y/n)" kill-server

# after copying to a tmux buffer, hit y again to copy to clipboard
bind y run "tmux save-buffer - | reattach-to-user-namespace pbcopy"


# copy and past with mouse:
# press shift + select with mouse to copy
# press shift + middle button to paste

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# enable activity alerts
#START:activity
setw -g monitor-activity on
set -g visual-activity on
set -g visual-bell on
set -g bell-action none
#set -g bell-on-alert off
#END:activity



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
