session_name: dsproject_web
start_directory: ~/PycharmProjects/dsproject_web
windows:
- focus: 'true'
  layout: 50ef,183x48,0,0[183x17,0,0,44,183x15,0,18,45,183x14,0,34,46]
  panes:
  - shell_command:
    - cd dsproject_web_docker_containers/src/dsproject_web_docker_containers
    -  workon dsproject_web_docker_containers
    -  echo "python main.py"
  - focus: 'true'
    shell_command:
    - cd dsproject_web_docker_containers/docker_compose
    - workon dsproject_web_docker_containers
    - echo "sudo systemctl stop nginx\ndocker-compose up"
  - shell_command:
    - cd dsproject_web_api
    - workon dsproject_web_api
    - uvicorn dsproject_web_api.main:app --reload --log-level=debug --host 0.0.0.0

  window_name: zsh
